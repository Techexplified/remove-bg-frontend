<!DOCTYPE html>
<html lang="en" style="background:#0f0c18">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemoveBG</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; background: #0f0c18; overflow: hidden; }
      .spin { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes proc-pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.5} }
    </style>
  </head>
  <body style="background:#0f0c18">
    <div id="root" style="background:#0f0c18"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
